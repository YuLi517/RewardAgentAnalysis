
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 SCENARIO 对比</title>
  <link rel="stylesheet" href="/static/scenario_compare.css">
</head>
<body>
  <div class="cmp-container">
    <h1 class="cmp-title">📊 场景对比</h1>

    <div class="cmp-layout">
      <!-- 左侧栏: scenario 列表 (v1.0.5: glow-card) -->
      <div class="cmp-sidebar-wrap">
        <div class="glow-card">
          <div class="glow-border"></div>
          <div class="glow-inner">
            <h3>📋 场景 (选 2-4)</h3>
            <div id="scenario-list" class="scenario-list">加载中...</div>
            <div class="cmp-actions">
              <button id="btn-export-png" class="cmp-btn">📷 导出 PNG</button>
              <button id="btn-export-csv" class="cmp-btn">📊 导出 CSV (选 1 个)</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 中间: 8 subplot 折线 (v1.0.5: glow-card) -->
      <div class="cmp-main">
        <div class="glow-card">
          <div class="glow-border"></div>
          <div class="glow-inner">
            <div class="cmp-plots">
              <canvas id="plot-canvas" width="900" height="600"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/scenario_compare.js"></script>
</body>
</html>
